Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children:
        - Formrun
        - AWSCloud
        - Reviewer
    Formrun:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: formrun
    Reviewer:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: 審査担当者

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Align: top
      Children:
        - L3Account
        - ManagementAccount

    # 顧客情報と証跡はL3アカウントに閉じ込める。
    L3Account:
      Type: AWS::Diagram::Account
      Title: L3アカウント（既存）
      Direction: vertical
      Children:
        - L3Region
    L3Region:
      Type: AWS::Region
      Title: ap-northeast-1
      Direction: vertical
      Children:
        - L3ManagedServices
        - L3VPC
    L3ManagedServices:
      Type: AWS::Diagram::Resource
      Preset: BlankGroup
      Title: VPC外のAWSマネージドサービス
      Direction: vertical
      BorderColor: "rgba(0,0,0,255)"
      BorderType: dashed
      Children:
        - L3Ingress
        - L3Analysis
    L3Ingress:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - WebhookApi
        - EvidenceBucket
    L3Analysis:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ReviewWorkflow
        - Textract
        - Bedrock
    L3VPC:
      Type: AWS::EC2::VPC
      Title: L3処理VPC
      Direction: vertical
      Children:
        - L3AZs
    L3AZs:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - L3AZa
        - L3AZc
    L3AZa:
      Type: AWS::EC2::AvailabilityZone
      Title: ap-northeast-1a
      Children:
        - L3PrivateSubnetA
    L3PrivateSubnetA:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: プライベートサブネット
      Direction: vertical
      Children:
        - IngestLambda
        - IdentityLambda
    L3AZc:
      Type: AWS::EC2::AvailabilityZone
      Title: ap-northeast-1c
      Children:
        - L3PrivateSubnetC
    L3PrivateSubnetC:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: プライベートサブネット
      Direction: vertical
      Children:
        - AwardLambda
        - ExportLambda

    WebhookApi:
      Type: AWS::ApiGatewayV2::Api
      Title: Webhook受付
    IngestLambda:
      Type: AWS::Lambda::Function
      Title: 申請・証跡取込
    EvidenceBucket:
      Type: AWS::S3::Bucket
      Title: 顧客情報・証跡
    ReviewWorkflow:
      Type: AWS::StepFunctions
      Title: 精査ワークフロー
    Textract:
      Type: AWS::Diagram::Resource
      Preset: Amazon Textract
      Title: 証跡抽出
    Bedrock:
      Type: AWS::Diagram::Resource
      Preset: Amazon Bedrock
      Title: 判定支援
    IdentityLambda:
      Type: AWS::Lambda::Function
      Title: 本人確認
    AwardLambda:
      Type: AWS::Lambda::Function
      Title: 付与判定
    ExportLambda:
      Type: AWS::Lambda::Function
      Title: 持出制御

    ManagementAccount:
      Type: AWS::Diagram::Account
      Title: 管理システム用アカウント
      Direction: vertical
      Children:
        - ManagementGlobalServices
        - ManagementRegion
    ManagementGlobalServices:
      Type: AWS::Diagram::Resource
      Preset: BlankGroup
      Title: グローバルサービス（VPC外）
      BorderColor: "rgba(0,0,0,255)"
      BorderType: dashed
      Children:
        - AdminCloudFront
    ManagementRegion:
      Type: AWS::Region
      Title: ap-northeast-1
      Direction: vertical
      Children:
        - ManagementManagedServices
        - ManagementVPC
    ManagementManagedServices:
      Type: AWS::Diagram::Resource
      Preset: BlankGroup
      Title: VPC外のAWSマネージドサービス
      Direction: vertical
      BorderColor: "rgba(0,0,0,255)"
      BorderType: dashed
      Children:
        - ManagementUI
        - ResultIngestion
    ManagementUI:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ManagementBackend
        - ManagementFrontend
    ManagementBackend:
      Type: AWS::Diagram::VerticalStack
      Children:
        - StaffCognito
        - ManagementApi
    ManagementFrontend:
      Type: AWS::Diagram::VerticalStack
      Children:
        - AdminBucket
    ResultIngestion:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ResultBus
        - QueueGroup
        - ApplicationTable
    QueueGroup:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - IntakeQueue
        - IntakeDLQ
    ManagementVPC:
      Type: AWS::EC2::VPC
      Title: 管理処理VPC
      Children:
        - ManagementAZa
    ManagementAZa:
      Type: AWS::EC2::AvailabilityZone
      Title: ap-northeast-1a
      Children:
        - ManagementPrivateSubnet
    ManagementPrivateSubnet:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: プライベートサブネット
      Children:
        - ReceiverLambda

    AdminCloudFront:
      Type: AWS::CloudFront
      Title: 管理画面
    AdminBucket:
      Type: AWS::S3::Bucket
      Title: 静的ファイル
    StaffCognito:
      Type: AWS::Cognito::UserPool
      Title: 社内認証
    ManagementApi:
      Type: AWS::ApiGatewayV2::Api
      Title: 管理API
    ResultBus:
      Type: AWS::Events
      Title: 結果イベント
    IntakeQueue:
      Type: AWS::SQS::Queue
      Title: 取込キュー
    IntakeDLQ:
      Type: AWS::SQS::Queue
      Title: DLQ
    ReceiverLambda:
      Type: AWS::Lambda::Function
      Title: 受信・版管理
    ApplicationTable:
      Type: AWS::DynamoDB::Table
      Title: 申請・版履歴

  Links:
    - Source: Formrun
      SourcePosition: E
      Target: WebhookApi
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: WebhookApi
      SourcePosition: S
      Target: L3VPC
      TargetPosition: N
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: EvidenceBucket
      SourcePosition: S
      Target: ReviewWorkflow
      TargetPosition: N
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: ReviewWorkflow
      SourcePosition: E
      Target: Textract
      TargetPosition: W
      TargetArrowHead: { Type: Open }
    - Source: Textract
      SourcePosition: E
      Target: Bedrock
      TargetPosition: W
      TargetArrowHead: { Type: Open }
    - Source: IdentityLambda
      SourcePosition: E
      Target: AwardLambda
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: AwardLambda
      SourcePosition: E
      Target: ExportLambda
      TargetPosition: W
      TargetArrowHead: { Type: Open }
    - Source: ExportLambda
      SourcePosition: E
      Target: ResultBus
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: ResultBus
      SourcePosition: E
      Target: IntakeQueue
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: IntakeQueue
      SourcePosition: E
      Target: IntakeDLQ
      TargetPosition: W
      TargetArrowHead: { Type: Open }
    - Source: IntakeQueue
      SourcePosition: S
      Target: ManagementVPC
      TargetPosition: N
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: ManagementVPC
      SourcePosition: E
      Target: ApplicationTable
      TargetPosition: S
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: Reviewer
      SourcePosition: W
      Target: AdminCloudFront
      TargetPosition: E
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: AdminCloudFront
      SourcePosition: S
      Target: AdminBucket
      TargetPosition: N
      TargetArrowHead: { Type: Open }
    - Source: StaffCognito
      SourcePosition: S
      Target: ManagementApi
      TargetPosition: N
      TargetArrowHead: { Type: Open }
