Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children:
        - Formrun
        - AWSCloud
        - Reviewer
    Formrun:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: formrun
    Reviewer:
      Type: AWS::Diagram::Resource
      Preset: User
      Title: 審査担当者

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: horizontal
      Align: top
      Children:
        - L3Account
        - ManagementAccount

    # 顧客情報と証跡はL3アカウントに閉じ込める。
    L3Account:
      Type: AWS::Diagram::Account
      Title: L3アカウント（既存）
      Direction: vertical
      Children:
        - L3Region
    L3Region:
      Type: AWS::Region
      Title: ap-northeast-1
      Direction: vertical
      Children:
        - L3EntryServices
        - L3ProcessingArea
    L3EntryServices:
      Type: AWS::Diagram::Resource
      Preset: BlankGroup
      Direction: horizontal
      BorderColor: "rgba(0,0,0,255)"
      BorderType: dashed
      Children:
        - WebhookApi
        - ReviewStateMachine
        - L3LambdaImages
    L3ProcessingArea:
      Type: AWS::Diagram::HorizontalStack
      Align: top
      Children:
        - L3VPC
        - L3WorkflowDependencies
    L3WorkflowDependencies:
      Type: AWS::Diagram::Resource
      Preset: BlankGroup
      Direction: vertical
      BorderColor: "rgba(0,0,0,255)"
      BorderType: dashed
      Children:
        - EvidenceBucket
        - Textract
        - Bedrock
    L3VPC:
      Type: AWS::EC2::VPC
      Title: L3処理VPC
      Direction: vertical
      Children:
        - L3AZa
    L3AZa:
      Type: AWS::EC2::AvailabilityZone
      Title: ap-northeast-1a
      Children:
        - L3PrivateSubnet
    L3PrivateSubnet:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: プライベートサブネット
      Direction: vertical
      Children:
        - L3WorkflowLayout
    L3WorkflowLayout:
      Type: AWS::Diagram::VerticalStack
      Children:
        - IngestTaskState
        - IdentityTaskState
        - AwardTaskState
        - ExportTaskState

    WebhookApi:
      Type: AWS::ApiGatewayV2::Api
      Title: Webhook受付
    ReviewStateMachine:
      Type: AWS::StepFunctions
      Title: Step Functions Standard
    IngestLambda:
      Type: AWS::Lambda::Function
      Title: 申請・証跡取込
    IngestTaskState:
      Type: AWS::Diagram::Resource
      HeaderAlign: left
      FillColor: "rgba(255,255,255,255)"
      BorderColor: "rgba(87,96,106,255)"
      Children:
        - IngestLambda
    EvidenceBucket:
      Type: AWS::S3::Bucket
      Title: 顧客情報・証跡
    IdentityTaskState:
      Type: AWS::Diagram::Resource
      HeaderAlign: left
      FillColor: "rgba(255,255,255,255)"
      BorderColor: "rgba(87,96,106,255)"
      Children:
        - IdentityLambda
    AwardTaskState:
      Type: AWS::Diagram::Resource
      HeaderAlign: left
      FillColor: "rgba(255,255,255,255)"
      BorderColor: "rgba(87,96,106,255)"
      Children:
        - AwardLambda
    ExportTaskState:
      Type: AWS::Diagram::Resource
      HeaderAlign: left
      FillColor: "rgba(255,255,255,255)"
      BorderColor: "rgba(87,96,106,255)"
      Children:
        - ExportLambda
    ReviewWorkflow:
      Type: AWS::StepFunctions
      Title: Step Functions workflow
      SpanResources:
        - IngestTaskState
        - IdentityTaskState
        - AwardTaskState
        - ExportTaskState
      BorderColor: "rgba(232,22,122,255)"
      BorderType: solid
    Textract:
      Type: AWS::Diagram::Resource
      Preset: Amazon Textract
      Title: 証跡抽出
    Bedrock:
      Type: AWS::Diagram::Resource
      Preset: Amazon Bedrock
      Title: 判定支援
    L3LambdaImages:
      Type: AWS::ECR
      Title: Lambdaイメージ
    IdentityLambda:
      Type: AWS::Lambda::Function
      Title: 本人確認
    AwardLambda:
      Type: AWS::Lambda::Function
      Title: 付与判定
    ExportLambda:
      Type: AWS::Lambda::Function
      Title: 持出制御

    ManagementAccount:
      Type: AWS::Diagram::Account
      Title: 管理システム用アカウント
      Direction: vertical
      Children:
        - ManagementGlobalServices
        - ManagementRegion
    ManagementGlobalServices:
      Type: AWS::Diagram::Resource
      Preset: BlankGroup
      Align: left
      BorderColor: "rgba(0,0,0,255)"
      BorderType: dashed
      Children:
        - AdminCloudFront
    ManagementRegion:
      Type: AWS::Region
      Title: ap-northeast-1
      Direction: vertical
      Children:
        - ManagementManagedServices
        - ManagementVPC
    ManagementManagedServices:
      Type: AWS::Diagram::Resource
      Preset: BlankGroup
      Direction: vertical
      BorderColor: "rgba(0,0,0,255)"
      BorderType: dashed
      Children:
        - ManagementUI
        - ResultIngestion
    ManagementUI:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - AdminBucket
        - StaffCognito
        - ManagementApi
    ResultIngestion:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - ResultBus
        - IntakeQueue
        - IntakeDLQ
        - ApplicationTable
    ManagementVPC:
      Type: AWS::EC2::VPC
      Title: 管理処理VPC
      Children:
        - ManagementAZa
    ManagementAZa:
      Type: AWS::EC2::AvailabilityZone
      Title: ap-northeast-1a
      Children:
        - ManagementPrivateSubnet
    ManagementPrivateSubnet:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: プライベートサブネット
      Children:
        - ReceiverLambda

    AdminCloudFront:
      Type: AWS::CloudFront
      Title: 管理画面
    AdminBucket:
      Type: AWS::S3::Bucket
      Title: 静的ファイル
    StaffCognito:
      Type: AWS::Cognito::UserPool
      Title: 社内認証
    ManagementApi:
      Type: AWS::ApiGatewayV2::Api
      Title: 管理API
    ResultBus:
      Type: AWS::Events
      Title: 結果イベント
    IntakeQueue:
      Type: AWS::SQS::Queue
      Title: 取込キュー
    IntakeDLQ:
      Type: AWS::SQS::Queue
      Title: DLQ
    ReceiverLambda:
      Type: AWS::Lambda::Function
      Title: 受信・版管理
    ApplicationTable:
      Type: AWS::DynamoDB::Table
      Title: 申請・版履歴

  Links:
    - Source: Formrun
      SourcePosition: E
      Target: WebhookApi
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: WebhookApi
      SourcePosition: E
      Target: ReviewStateMachine
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: ReviewStateMachine
      SourcePosition: S
      Target: IngestTaskState
      TargetPosition: N
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: IngestLambda
      SourcePosition: E
      Target: EvidenceBucket
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: IngestTaskState
      SourcePosition: S
      Target: IdentityTaskState
      TargetPosition: N
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: IdentityLambda
      SourcePosition: ENE
      Target: Textract
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: IdentityLambda
      SourcePosition: ESE
      Target: Bedrock
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: L3LambdaImages
      SourcePosition: S
      Target: L3WorkflowLayout
      TargetPosition: N
      TargetArrowHead: { Type: Open }
      Type: orthogonal
      LineStyle: dashed
    - Source: IdentityTaskState
      SourcePosition: S
      Target: AwardTaskState
      TargetPosition: N
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: AwardTaskState
      SourcePosition: S
      Target: ExportTaskState
      TargetPosition: N
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: ExportTaskState
      SourcePosition: E
      Target: ResultBus
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: ResultBus
      SourcePosition: E
      Target: IntakeQueue
      TargetPosition: W
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: IntakeQueue
      SourcePosition: E
      Target: IntakeDLQ
      TargetPosition: W
      TargetArrowHead: { Type: Open }
    - Source: IntakeQueue
      SourcePosition: S
      Target: ManagementVPC
      TargetPosition: N
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: ManagementVPC
      SourcePosition: E
      Target: ApplicationTable
      TargetPosition: S
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: Reviewer
      SourcePosition: W
      Target: AdminCloudFront
      TargetPosition: E
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: AdminCloudFront
      SourcePosition: S
      Target: AdminBucket
      TargetPosition: N
      TargetArrowHead: { Type: Open }
      Type: orthogonal
    - Source: StaffCognito
      SourcePosition: E
      Target: ManagementApi
      TargetPosition: W
      TargetArrowHead: { Type: Open }
